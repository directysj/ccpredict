[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpredict"
version = "0.1.0"
description = "Predict cell-cycle reporter readout from O2VAE embeddings along with single-cell trajectories"
authors = [{ name = "Jalim" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "csaps",
    "imbalanced-learn",
    "torch>=2.5",
]

[project.optional-dependencies]
test = ["pytest"]
# Only for tests/parity (the notebook reference and the Keras-vs-PyTorch checks).
parity = ["tensorflow", "keras>=3"]

[project.scripts]
ccpredict = "ccpredict.__main__:main"

[tool.setuptools]
packages = ["ccpredict"]
